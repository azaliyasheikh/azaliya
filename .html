<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assignment.css">
    <title>10-Day Weather Forecast</title>
</head>
<body>
    <div class="container">
        <h2>10 days wheater forecast</h2>
        <div class="forecast-row top-row">
            <div class="sunny"></div>
            <span class="forecast-text">friday 11oct: 25°C, Sunny</span>
         
        </div>
        <div class="forecast-row">
            <div class="sunny"></div>
            <span class="forecast-text">saturday 12oct: 22°C, </span>
        </div>
        <div class="forecast-row">
            <div class="sunny"></div>
            <span class="forecast-text">sunday 13 oct: 20°C, </span>
        </div>
        <div class="forecast-row">
            <div class="weather-icon"></div>
            <span class="forecast-text">monday 14oct: 23°C, </span>
        </div>
        <div class="forecast-row">
            <div class="weather-icon"></div>
            <span class="forecast-text">tuesday 15 oct: 27°C, </span>
        </div>
        <div class="forecast-row">
            <div class="sunny"></div>
            <span class="forecast-text">wednesday 16 oct: 24°C, </span>
        </div>
        <div class="forecast-row">
            <div class="weather-icon"></div>
            <span class="forecast-text">thursday 17 oct: 26°C, </span>
        </div>
        <div class="forecast-row">
            <div class="sunny"></div>
            <span class="forecast-text">friday 18 oct: 21°C, </span>
        </div>
        <div class="forecast-row">
            <div class="weather-icon"></div>
            <span class="forecast-text">saturday 19oct: 19°C, </span>
        </div>
        <div class="forecast-row bottom-row">
            <div class="weather-icon"></div>
            <span class="forecast-text">sunday 20 oct: 28°C, </span>
        </div>
    </div>
</body>
</html>
